name: Conformance Documentation Sync Check

on:
  push:
    branches: [main]
    paths:
      - "conformance/**"
  pull_request:
    paths:
      - "conformance/**"

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate TEST_CASES.md sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q pyyaml>=6.0

      - name: Validate TEST_CASES.md matches test config
        run: python .github/scripts/validate_test_docs.py
